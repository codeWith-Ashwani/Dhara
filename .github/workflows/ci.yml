name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest --cov=dhara --cov-report=term-missing
      - run: python scripts/run_sprint5_pilot_rehearsal.py --output .pytest_tmp/sprint5.json
      - run: python scripts/run_sprint6_pilot_controls.py --output .pytest_tmp/sprint6.json
